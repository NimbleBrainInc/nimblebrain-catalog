# Starter prompts for the zoho plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the prompt is sent.
- title: Which deals need attention?
  prompt: List my open Zoho CRM deals with no activity in the last two weeks, with their stage and amount.
- title: New leads
  prompt: Show the leads added to Zoho CRM this week and suggest which to follow up first.
- title: Look up an account
  prompt: Ask me which account, then show its Zoho CRM record, contacts, and open deals.
