# Conversation starters for the whatsapp plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Message a customer
  text: Help me send a WhatsApp message to a customer. Ask me who and what to say, and show me the message
    before sending.
- title: Review my templates
  text: List my approved WhatsApp message templates and what each is for.
- title: Draft a template
  text: Help me draft a new WhatsApp message template. Ask me what it's for and suggest the wording.
