# Conversation starters for the ahrefs plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Audit a domain
  text: Ask me which domain, then use Ahrefs to show its domain rating, organic traffic, top pages, and top keywords.
- title: Find keyword ideas
  text: Ask me a topic and country, then use Ahrefs to suggest keywords with their volume and difficulty.
- title: Compare competitors
  text: Ask me my domain and a competitor's, then use Ahrefs to compare their traffic, keywords, and backlinks.
