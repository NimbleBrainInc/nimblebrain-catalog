# Conversation starters for the linkedin plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Draft a post
  text: Help me draft a LinkedIn post. Ask me the topic and the point I want to make. Don't publish
    until I approve it.
- title: How is my company page doing?
  text: 'Ask me which LinkedIn company page I administer, then show how its recent posts performed:
    impressions, reactions, and comments.'
- title: Share a link
  text: Ask me for a link and why it matters, then draft a short LinkedIn post sharing it for me to
    approve.
