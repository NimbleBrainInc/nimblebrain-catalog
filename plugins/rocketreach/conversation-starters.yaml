# Conversation starters for the rocketreach plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Find someone's contact info
  text: Ask me the person's name and company, then look them up in RocketReach and show their work email
    and phone.
- title: Find people at a company
  text: Ask me the company and the roles I'm after, then use RocketReach to list the matching people.
- title: Look up a company
  text: 'Ask me which company, then show what RocketReach has on it: size, industry, and location.'
