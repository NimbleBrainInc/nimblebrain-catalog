# Conversation starters for the googletasks plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: What's on my list?
  text: Show my open Google Tasks, grouped by list, with anything scheduled or due this week first.
- title: Add to-dos from notes
  text: I'll paste some notes. Turn them into to-dos with dates where I gave them, show me the list,
    and add them to Google Tasks once I approve.
- title: What did I finish?
  text: List the Google Tasks I completed in the last week.
