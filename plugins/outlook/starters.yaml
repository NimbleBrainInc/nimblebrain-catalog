# Starter prompts for the outlook plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the prompt is sent.
- title: Summarize my unread email
  prompt: Summarize my unread Outlook email from the last day, grouped by sender, and flag anything that
    needs a reply today.
- title: What's on today?
  prompt: Show my Outlook calendar for today with times, attendees, and anything I should prepare.
- title: Draft replies
  prompt: Find the Outlook threads from this week still waiting on my reply and draft a response to each.
    Save them as drafts; don't send anything.
