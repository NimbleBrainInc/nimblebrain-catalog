# Conversation starters for the apify plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Scrape a site
  text: Ask me the website and what data I need, then find a suitable Apify Actor and tell me what running
    it would do before you run it.
- title: Find an Actor
  text: Ask me what I want to extract, then search the Apify Store and show the best Actors for it.
