# Starter prompts for the granola plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the prompt is sent.
- title: Recap my last meeting
  prompt: 'Summarize my most recent meeting in Granola: decisions, action items, and who owns them.'
- title: What did I commit to?
  prompt: List the action items assigned to me across my Granola meetings this week.
- title: Find what was said
  prompt: Help me find something from a meeting. Ask me the topic, then search my Granola meetings and
    quote what was decided.
