# Starter prompts for the paypal plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the prompt is sent.
- title: Recent transactions
  prompt: Summarize my PayPal transactions from the last 30 days, with totals and the largest ones.
- title: Unpaid invoices
  prompt: List my unpaid PayPal invoices with amounts and due dates, oldest first.
- title: Open disputes
  prompt: List any open PayPal disputes with what's needed from me on each.
