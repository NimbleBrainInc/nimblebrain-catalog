# Conversation starters for the googleslides plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Draft a deck
  text: Help me draft a Google Slides deck. Ask me the topic and audience, propose an outline, then
    create the slides.
- title: Summarize a deck
  text: Ask me which Google Slides deck to read, then summarize it slide by slide.
- title: Start from a template
  text: Ask me which deck to use as a template and what the new one is for, then make a copy and fill
    in the content.
