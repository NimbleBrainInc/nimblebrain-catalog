# Conversation starters for the googleslides plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Summarize a deck
  text: Ask me for the link to a Google Slides deck, then summarize it slide by slide.
- title: Fill in a deck
  text: Ask me for the link to a Google Slides deck and what it is for, then propose text for each
    slide. Update the deck once I approve.
- title: Add a slide
  text: Ask me for the link to a Google Slides deck and what the new slide should say, show me the
    content, and add it once I approve.
