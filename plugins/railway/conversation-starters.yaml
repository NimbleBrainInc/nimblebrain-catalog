# Conversation starters for the railway plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: What am I running?
  text: List my Railway projects and services with their latest deployment status.
- title: Why did a deploy fail?
  text: Ask me which Railway service, then read its latest deployment logs and explain what went wrong.
