# Conversation starters for the miro plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Summarize a board
  text: Ask me which Miro board, then read it and summarize its main themes, decisions, and open questions.
- title: Draw a diagram
  text: Help me make a diagram on a Miro board. Ask me what it should show and which board, then create it once I approve the outline.
- title: Turn notes into a table
  text: Ask me which Miro board, then collect its sticky notes into a table grouped by theme.
