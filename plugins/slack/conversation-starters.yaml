# Conversation starters for the slack plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Catch me up
  text: Summarize the Slack channels I'm in that had activity today, and flag anything that mentions
    me.
- title: Post an update
  text: Help me post an update to a Slack channel. Ask me which channel and what to say, and show me
    the message before posting.
- title: Find a conversation
  text: Help me find a Slack conversation. Ask me the topic or person, then search and show the best
    matches.
