# Conversation starters for the postman plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: What's in my workspace?
  text: List the collections and environments in my Postman workspaces.
- title: Find an API request
  text: Help me find a request in Postman. Ask me what it does, then search my collections and show it.
