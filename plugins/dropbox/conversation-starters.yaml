# Conversation starters for the dropbox plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Find a file
  text: Help me find a file in Dropbox. Ask me what it's about, then search and show the best matches.
- title: Summarize a document
  text: Ask me which Dropbox file to read, then summarize it in a few bullet points.
- title: What's shared?
  text: List the Dropbox files and folders I've shared by link, with who can open them.
