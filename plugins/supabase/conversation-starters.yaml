# Conversation starters for the supabase plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: What am I running?
  text: List my Supabase projects with their status and region.
- title: Explore a database
  text: Ask me which Supabase project, then list its tables and summarize the schema.
- title: Run a query
  text: Help me query a Supabase database. Ask me the project and what I need, show me the SQL, and run
    it once I approve.
