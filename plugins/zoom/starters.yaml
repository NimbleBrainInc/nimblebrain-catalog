# Starter prompts for the zoom plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the prompt is sent.
- title: Recap my last meeting
  prompt: 'Summarize my most recent Zoom meeting from its AI summary: decisions and action items.'
- title: What's scheduled?
  prompt: List my upcoming Zoom meetings this week with times and topics.
- title: Find a recording
  prompt: Help me find a Zoom recording. Ask me the meeting or date, then show the matches.
