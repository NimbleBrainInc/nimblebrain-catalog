# Starter prompts for the wix plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the prompt is sent.
- title: What's on my site?
  prompt: 'List my Wix sites and summarize what each one has: store, bookings, blog, or events.'
- title: Recent orders
  prompt: Show recent orders from my Wix store with totals and status.
- title: Upcoming bookings
  prompt: List upcoming Wix bookings for this week with times and customers.
