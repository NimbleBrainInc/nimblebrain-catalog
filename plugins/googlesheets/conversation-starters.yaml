# Conversation starters for the googlesheets plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Summarize a spreadsheet
  text: Ask me for the link to a Google Sheet, then summarize what it tracks and anything that stands out.
- title: Add rows from notes
  text: I'll paste some notes. Turn them into rows and add them to a Google Sheet I choose, after
    showing me the rows first.
- title: Add a summary tab
  text: Ask me for the link to a Google Sheet and what to total, then propose a summary tab with formulas.
    Create it once I approve.
