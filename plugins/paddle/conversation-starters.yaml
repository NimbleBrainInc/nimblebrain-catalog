# Conversation starters for the paddle plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: How is revenue doing?
  text: Summarize my Paddle revenue for this month compared with last month.
- title: Look up a customer
  text: Ask me which customer, then show their Paddle subscriptions and recent transactions.
- title: Review my pricing
  text: List my Paddle products and prices.
