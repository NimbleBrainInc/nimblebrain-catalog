# Conversation starters for the googledocs plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Summarize a doc
  text: Ask me for the link to a Google Doc, then summarize it in a few bullet points with any decisions
    and open questions.
- title: Edit a doc
  text: Ask me for the link to a Google Doc and what to change, show me the edits you plan, and make
    them once I approve.
- title: Review comments
  text: Ask me for the link to a Google Doc, then list its open comments and suggest a reply to each.
    Don't post anything until I agree.
