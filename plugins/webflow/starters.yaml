# Starter prompts for the webflow plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the prompt is sent.
- title: Review my site's SEO
  prompt: List the pages on my Webflow site with their titles and meta descriptions, and flag the ones
    that are missing or weak.
- title: Draft a blog post
  prompt: Help me draft a blog post for my Webflow CMS. Ask me the topic, and create it as a draft once
    I approve it.
- title: What's in my CMS?
  prompt: List my Webflow CMS collections and how many items each has.
