# Conversation starters for the fathom plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Recap my last meeting
  text: 'Summarize my most recent Fathom meeting: decisions, action items, and who owns them.'
- title: What did I commit to?
  text: List the action items assigned to me across my Fathom meetings this week.
- title: Find what was said
  text: Help me find something from a meeting. Ask me the topic, then search my Fathom meetings and show what was decided.
