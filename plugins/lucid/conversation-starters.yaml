# Conversation starters for the lucid plugin: what a host offers a person who has it
# and does not know what to ask. A title is what they read; the text is sent.
- title: Find a diagram
  text: Help me find a Lucid diagram or document. Ask me what it's about, then search and show the best
    matches.
- title: Summarize a document
  text: Ask me which Lucid document, then summarize what it shows and any open questions it raises.
- title: Draw a diagram
  text: Help me make a Lucid diagram. Ask me what it should show, then create it once I approve the outline.
