name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src tests
      - run: uv run pytest -q
      # Builds against the live upstream registry, so a member that is missing or
      # malformed upstream fails here, before it reaches main.
      - run: uv run catalog build
