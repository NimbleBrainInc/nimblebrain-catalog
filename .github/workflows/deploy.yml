name: Deploy

# Rebuilds from upstream on every change to the catalog, and hourly so a product's
# new release upstream reaches catalog.nimblebrain.ai without a commit here. A
# product's release workflow can send `repository_dispatch` (type `upstream-published`)
# to publish at once.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [upstream-published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --no-dev
      # A failed build stops here, so the catalog keeps serving the last good copy.
      - run: uv run catalog build
      # An hourly rebuild changes the catalog without a pull request, so it is
      # checked here too: a catalog that breaks the spec publishes nothing.
      - uses: NimbleBrainInc/ai-catalog-check@v0.1.2
        with:
          catalogs: dist/site/.well-known/ai-catalog.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.REGISTRY_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: uv run catalog publish --bucket registry.nimblebrain.ai --distribution "${{ vars.REGISTRY_CF_DISTRIBUTION_ID }}"
