name: Deploy

# Rebuilds from upstream on every change to the catalog, and hourly so a product's
# new release upstream reaches registry.nimblebrain.ai without a commit here. A
# product's release workflow can send `repository_dispatch` (type `upstream-published`)
# to publish at once.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [upstream-published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --no-dev
      # A failed build stops here, so the registry keeps serving the last good copy.
      - run: uv run registry build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.REGISTRY_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: uv run registry publish --bucket registry.nimblebrain.ai --distribution "${{ vars.REGISTRY_CF_DISTRIBUTION_ID }}"
