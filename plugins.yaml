# The plugins in the catalog. A plugin is what a person installs: its connector
# and, when the catalog has one, the skill for using it (ADR-0068).
#
#   name     the plugin's name: lowercase letters, digits, `-` and `.`. It is the
#            install id (`notion@nimblebrain`) and prefixes the plugin's skills.
#   server   the catalog server the plugin connects, by its registry name
#
# A plugin's skills are written by hand under plugins/<name>/skills/. Its manifest
# and MCP config restate its server, so the build generates them into the plugin's
# zip and never stores them here.

