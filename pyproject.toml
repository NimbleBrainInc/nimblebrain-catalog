[project]
name = "nimblebrain-catalog"
version = "0.1.0"
description = "Builds catalog.nimblebrain.ai, NimbleBrain's connector catalog and a subregistry of the official MCP Registry"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "pyyaml>=6.0",
]

[project.scripts]
catalog = "nimblebrain_catalog.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
