# Connectors brokered by Composio. Composio holds the vendor's tokens; the runtime
# keeps an opaque connected-account id per workspace and calls tools through a
# per-session Composio MCP URL. The remote url is a placeholder replaced at install.
# Each entry's `toolkit` is the key the deployment wires its Composio auth config
# under. `tools` is curated: toolkits publish more tools than tool search can hold.

servers:
  - name: io.asana/mcp
    title: Asana
    description: Tasks, projects, and team workflows
    version: "0.1.0"
    icons:
      - src: https://static.nimblebrain.ai/icons/asana.png
        sizes: ["any"]
    remotes:
      - type: streamable-http
        url: https://backend.composio.dev/v3/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: composio
        composio:
          toolkit: asana
          # Asana publishes 84 tool slugs — curate to a task/project
          # working set. Slugs verified against the live Composio catalog
          # (GET /api/v3/tools?toolkit_slug=asana); note the `_A_` infix
          # (CREATE_A_TASK, GET_A_TASK) and that there is no
          # SEARCH_TASKS_IN_WORKSPACE — GET_TYPEAHEAD_OBJECTS is the
          # name-search path. Expand from the 84-slug set as needs surface.
          tools:
            - ASANA_CREATE_A_TASK
            - ASANA_GET_A_TASK
            - ASANA_UPDATE_A_TASK
            - ASANA_GET_TASKS_FROM_A_PROJECT
            - ASANA_GET_A_USER_TASK_LIST
            - ASANA_CREATE_SUBTASK
            - ASANA_GET_TASK_SUBTASKS
            - ASANA_CREATE_TASK_COMMENT
            - ASANA_GET_STORIES_FOR_TASK
            - ASANA_GET_TYPEAHEAD_OBJECTS
            - ASANA_CREATE_A_PROJECT
            - ASANA_GET_A_PROJECT
            - ASANA_GET_WORKSPACE_PROJECTS
            - ASANA_GET_SECTIONS_IN_PROJECT
            - ASANA_GET_MULTIPLE_WORKSPACES
            - ASANA_GET_CURRENT_USER
        tags: [tasks, projects, composio]

  # Gmail (and Outlook below) route through Composio as a stopgap until our
  # own Google / Microsoft OAuth clients pass restricted-scope verification.
  - name: com.google/gmail
    title: Gmail
    description: Read, send, and draft mail
    version: "0.1.0"
    icons:
      - src: https://static.nimblebrain.ai/logos/gmail/light.svg
        sizes: ["any"]
    remotes:
      - type: streamable-http
        url: https://backend.composio.dev/v3/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: composio
        composio:
          toolkit: gmail
          # Curated working set. Composio's Gmail toolkit publishes
          # ~60 tools; exposing all of them blows up the agent's
          # tool-search context. Add to this list when a user need
          # surfaces; default tight.
          #
          # NOTE: the allowlist is necessary but not sufficient for the
          # destructive tools below. Composio gates delete/trash at the
          # project level — an allowlisted-but-disabled tool returns
          # "execution disabled for this project" rather than running.
          # Enable them on the gmail auth_config in the Composio
          # dashboard, and re-install the connector per workspace so the
          # session is minted with the updated tool filter (the filter
          # is baked at session-create time; see connector-tools.ts).
          #
          # GMAIL_DELETE_MESSAGE is deliberately omitted: it permanently
          # deletes arbitrary mail (users.messages.delete — bypasses
          # Trash, non-recoverable), exceeds the draft-pruning need, and
          # GMAIL_MOVE_TO_TRASH already covers reversible removal. Add it
          # only if a concrete purge-real-mail need surfaces.
          tools:
            - GMAIL_SEND_EMAIL
            - GMAIL_FETCH_EMAILS
            - GMAIL_FETCH_MESSAGE_BY_MESSAGE_ID
            - GMAIL_FETCH_MESSAGE_BY_THREAD_ID
            - GMAIL_LIST_THREADS
            - GMAIL_LIST_LABELS
            - GMAIL_CREATE_EMAIL_DRAFT
            - GMAIL_SEND_DRAFT
            - GMAIL_LIST_DRAFTS
            - GMAIL_DELETE_DRAFT
            - GMAIL_REPLY_TO_THREAD
            - GMAIL_FORWARD_MESSAGE
            - GMAIL_ADD_LABEL_TO_EMAIL
            - GMAIL_MOVE_TO_TRASH
            - GMAIL_SEARCH_PEOPLE
            - GMAIL_GET_PROFILE
        tags: [email, productivity, composio]

