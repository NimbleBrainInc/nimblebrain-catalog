# Curated connectors NimbleBrain offers: remote servers that authorize by DCR or by
# a static OAuth app. Each entry is the upstream MCP registry's `ServerDetail`, with
# NimbleBrain's fields under `_meta["ai.nimblebrain/connector"]`. Secrets stay out:
# an `auth: static` entry names its credential with `oauthClientSetup.clientSecretKey`,
# which a workspace admin sets.

servers:
  - name: com.notion/mcp
    title: Notion (org)
    description: Read & write workspace pages — shared workspace identity
    version: "1.0.0"
    icons:
      - src: https://static.nimblebrain.ai/logos/notion/light.svg
        sizes: ["any"]
    remotes:
      - type: streamable-http
        url: https://mcp.notion.com/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: dcr
        category: "Docs & files"
        tags: [wiki, notes, knowledge]

