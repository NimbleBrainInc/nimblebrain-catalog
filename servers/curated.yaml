  # Dropbox advertises DCR but only honors it for a curated partner
  # allowlist (Claude Desktop, Cursor, ChatGPT) — `/register` rejects
  # everyone else with "Dynamic client registration is not supported."
  # Wired here as `auth: static` so operators can bring their own
  # OAuth app from the Dropbox App Console. Drop back to `auth: dcr`
  # once Dropbox allowlists our redirect host.

  - name: com.dropbox/mcp
    title: Dropbox
    description: Files, folders, and shared links
    version: "1.0.0"
    icons:
      - src: https://static.nimblebrain.ai/logos/dropbox/light.svg
        sizes: ["any"]
    remotes:
      - type: streamable-http
        url: https://mcp.dropbox.com/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: static
        # Dropbox issues a refresh token ONLY when the authorize request carries
        # token_access_type=offline. Without it, the authorization_code exchange
        # returns a ~4h access token and NO refresh token, so the connection dies
        # every access-token lifetime and requires a full manual reconnect. This
        # is Dropbox's equivalent of Google's access_type=offline.
        additionalAuthorizationParams:
          token_access_type: offline
        requiredScopes:
          - files.metadata.read
          - files.content.read
          - files.content.write
          - sharing.write
          - account_info.read
        oauthClientSetup:
          portalUrl: https://www.dropbox.com/developers/apps
          hint: Create a Scoped Access app in the Dropbox App Console, enable the listed scopes, add the NimbleBrain redirect URI, then paste App key + App secret here
          clientSecretKey: dropbox.client_secret
        category: "Docs & files"
        tags: [storage]

