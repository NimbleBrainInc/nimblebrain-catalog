        # fireflies_share_meeting, which sends a transcript to any address.

  - name: com.close/mcp
    title: Close
    description: CRM leads, contacts, opportunities, and tasks
    version: "1.0.0"
    icons:
      - src: https://static.nimblebrain.ai/logos/close/light.svg
        sizes: ["any"]
    remotes:
      - type: streamable-http
        url: https://mcp.close.com/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: dcr
        # Close grades tools by scope. write_safe creates leads, contacts,
        # opportunities, notes, tasks, and draft emails; write_destructive
        # (updates, deletes, voice-agent calls) is deliberately not requested.
        # offline_access issues a refresh token.
        requiredScopes: [mcp.read, mcp.write_safe, offline_access]
        # Close's sign-in names no account, so the label on a connected Close
        # comes from asking it who the user is (org_info takes no arguments).
        account:
          tool: org_info
          field: current_user.email
        tags: [crm, sales]

  # Sage Intacct runs its MCP server on its own OAuth issuer (api-mcp.intacct.com)
  # with no dynamic client registration, so each customer brings a client from
  # the Sage Developer Console. That client is tied to the customer's Web
  # Services sender ID (so a tenant declares it once, under
  # config.connectors.oauthClients, rather than per workspace), needs the AI Gateway add-on, and must be authorized in
  # the Intacct company (Company > Security > Authorized client applications).
  # A client created minutes earlier fails tool calls with GW-0011 until it
  # propagates; reconnecting later clears it.
  - name: com.intacct/mcp
    title: Sage Intacct
    description: Read-only accounting data — GL, AP, AR, and reports
    version: "1.0.0"
    icons:
      - src: https://static.nimblebrain.ai/icons/mcp.png
        sizes: ["any"]
    remotes:
      - type: streamable-http
        url: https://mcp.intacct.com/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: static
        # offline_access is the only scope Sage advertises; it issues the
        # refresh token. Access tokens last 8 hours (expires_in 28800).
        requiredScopes: [offline_access]
        # Sage can reject an access token before its expiry with an error result
        # instead of a 401, so the runtime would neither refresh nor offer
        # Reconnect. Naming its wording makes the runtime refresh and retry; a
        # runtime that predates the key ignores it.
        inBandAuthErrors:
          - "authentication token has expired or is invalid"
        oauthClientSetup:
          portalUrl: https://developer.sage.com/intacct/
          hint: In the Sage Developer Console, create a Sage Intacct application on the AI-enabled sender ID, add the NimbleBrain redirect URI, then paste its client ID and secret here
          clientSecretKey: intacct.client_secret
        tags: [accounting, finance]

